name: Build APK

# Builds the debug APK. On pushes to main (and manual runs) it also publishes a
# GitHub Release with the APK attached, giving a stable download link:
#   https://github.com/scottsart1/Key/releases/latest/download/HouseKey-debug.apk
# On pull requests it only builds and uploads the APK as a workflow artifact, so
# the build is verified before merge.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Stage APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/HouseKey-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HouseKey-debug-apk
          path: dist/HouseKey-debug.apk
          if-no-files-found: error

      - name: Publish Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: HouseKey v1.0.${{ github.run_number }}
          body: |
            Debug build of HouseKey.

            Download `HouseKey-debug.apk` below and open it on your Android phone
            to install (you may need to allow installing from unknown sources).

            A physical NFC-capable device is required to emulate or read tags.
          files: dist/HouseKey-debug.apk
          make_latest: true
